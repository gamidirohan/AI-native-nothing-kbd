name: Android debug build and emulator test

# Builds the debug APK, saves it as a downloadable artifact, then installs it on a real Android
# emulator and runs the AI Writing flow end to end, saving screenshots.
#
# Run it by hand from the Actions tab ("Run workflow").
#
# It only runs on request for now: GitHub Actions on this account was blocked by a billing lock
# when this was set up, so a run on every push would just fail. Once that is fixed, add this
# under `on:` to build every push of the AI Writing branch:
#   push:
#     branches: [feature/ai-writing-assistant]
#     paths-ignore: ['docs/**', '**.md']
on:
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # arm64 is for phones, x86_64 is for the emulator below.
      - name: Build debug APK
        run: ./gradlew --no-daemon :assembleStableDebug -Pandroid.injected.build.abi=arm64-v8a,x86_64

      - name: Collect APK
        run: |
          mkdir -p out
          cp build/intermediates/apk/stable/debug/*.apk out/nothing-keyboard-ai-writing-debug.apk
          sha256sum out/nothing-keyboard-ai-writing-debug.apk | tee out/nothing-keyboard-ai-writing-debug.apk.sha256
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: nothing-keyboard-debug-apk
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 6144M
          heap-size: 576M
          disk-size: 8192M
          disable-animations: true
          script: bash .github/ci/emulator-smoke.sh out/nothing-keyboard-ai-writing-debug.apk

      - name: Save screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots-and-logs
          path: ci-out/
          if-no-files-found: warn
          retention-days: 30

      - name: Show result
        if: always()
        run: cat ci-out/summary.txt || echo "no summary was written"
