// Java-only wrapper around LiteRT-LM.
//
// LiteRT-LM is compiled with Kotlin 2.x, but this project's Kotlin compiler is 1.9.20 and cannot
// read those class files. javac ignores Kotlin metadata, so keeping every use of LiteRT-LM in a
// module without the Kotlin plugin lets the app consume it through a plain Java API.
plugins {
    id 'com.android.library' version '8.2.0'
}

android {
    namespace 'org.futo.inputmethod.litert'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 0.18.0 or newer is needed to load the current litert-community model files.
    //
    // The library is built with Kotlin 2.4 and coroutines 1.11, but the app compiles with
    // Kotlin 1.9. Gradle would pull the library's newer Kotlin libraries into the app's compile
    // classpath, which the 1.9 compiler cannot read. So the Kotlin libraries are excluded here
    // and the app's own versions are used at runtime instead. The library was run against
    // kotlin-stdlib 1.9.20 and coroutines 1.7.1 on a real model and works with them (only the
    // callback API used by LiteRtBridge was exercised, not the Flow API).
    implementation('com.google.ai.edge.litertlm:litertlm-android:0.19.1') {
        exclude group: 'org.jetbrains.kotlin'
        exclude group: 'org.jetbrains.kotlinx'
    }
}
